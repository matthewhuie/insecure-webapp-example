<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In &bull; Demo App</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-focus: rgba(79, 70, 229, 0.25);
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 1rem;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
    }

    .logo-icon svg {
      width: 24px;
      height: 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.35rem;
      word-break: break-word;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #fff;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-focus);
    }

    input::placeholder {
      color: #94a3b8;
    }

    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .secondary-btn {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1.25rem;
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .secondary-btn:hover {
      background: #e2e8f0;
    }

    .welcome-container {
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    .avatar-circle {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .avatar-circle svg {
      width: 32px;
      height: 32px;
    }

    .status-toast {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .status-toast.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .status-toast.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .footer-badge {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .badge-pill {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      
      <!-- Login View -->
      <div id="loginView">
        <div class="brand-header">
          <div class="logo-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <h1>Welcome!</h1>
          <p class="subtitle">Please enter your details to sign in</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </span>
              <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off" />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                </svg>
              </span>
              <input type="password" id="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="off" />
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">Sign In</span>
          </button>

          <div class="status-toast" id="statusToast"></div>
        </form>
      </div>

      <!-- Welcome View -->
      <div id="welcomeView" class="welcome-container" style="display: none;">
        <div class="avatar-circle">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
        <h1 id="welcomeGreeting">Hello, User!</h1>
        <p class="subtitle" style="margin-top: 0.5rem;">You have successfully signed in.</p>
        
        <div class="status-toast success" style="display: block; margin-top: 1.25rem;">
          Logged in successfully. 
        </div>

        <button type="button" class="secondary-btn" id="signOutBtn">Sign In Again</button>
      </div>

    </div>

    <div class="footer-badge">
      <span class="badge-pill">DEMO</span>
      <span>Created by Matthew Huie</span>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const statusToast = document.getElementById('statusToast');

    const loginView = document.getElementById('loginView');
    const welcomeView = document.getElementById('welcomeView');
    const welcomeGreeting = document.getElementById('welcomeGreeting');
    const signOutBtn = document.getElementById('signOutBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Signing in...';
      statusToast.className = 'status-toast';
      statusToast.style.display = 'none';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (response.ok) {
          welcomeGreeting.textContent = 'Hello, ' + username + '!';
          loginView.style.display = 'none';
          welcomeView.style.display = 'block';
        } else {
          statusToast.textContent = 'Sign in failed.';
          statusToast.className = 'status-toast error';
        }
      } catch (err) {
        statusToast.textContent = 'Connection error: ' + err.message;
        statusToast.className = 'status-toast error';
      } finally {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Sign In';
      }
    });


    signOutBtn.addEventListener('click', () => {
      document.getElementById('password').value = '';
      welcomeView.style.display = 'none';
      loginView.style.display = 'block';
    });
  </script>
</body>
</html>
